---
- name: Verify
  hosts: all
  gather_facts: true
  become: true

  vars_files:
    - ../../vars/main.yml

  vars:
    developer_remote_user: "{{ ansible_facts['env'].SUDO_USER | default('testuser') }}"
    docker_group_user: "{{ developer_remote_user }}"
    required_package_sets:
      - "{{ developer_packages_base }}"
      - "{{ developer_docker_packages }}"
      - ["code", "gh"]
    venv_path: "{{ developer_python_venv_path }}"
    git_hooks_path: "/home/{{ developer_remote_user }}/.git_hooks"
    linter_packages: "{{ developer_python_linter_packages }}"

  tasks:
    - name: Verify | Collect installed packages
      ansible.builtin.package_facts:
        manager: apt

    - name: Verify | Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item in ansible_facts.packages
      loop: "{{ required_package_sets | flatten }}"
      loop_control:
        label: "package {{ item }}"

    - name: Verify | Check docker CLI
      ansible.builtin.command: docker --version
      register: developer_docker_version
      changed_when: false
      failed_when: developer_docker_version.rc != 0

    - name: Verify | Check docker group membership for user
      ansible.builtin.command: "id -nG {{ docker_group_user }}"
      register: developer_user_groups
      changed_when: false
      failed_when: "'docker' not in developer_user_groups.stdout.split()"

    - name: Verify | Check VS Code binary is available
      become: true
      become_user: "{{ developer_remote_user }}"
      ansible.builtin.command: code --version --no-sandbox
      register: developer_code_version
      changed_when: false
      failed_when: developer_code_version.rc != 0

    - name: Verify | Check GitHub CLI is available
      ansible.builtin.command: gh --version
      register: developer_gh_version
      changed_when: false
      failed_when: developer_gh_version.rc != 0

    - name: Verify | Check Python virtualenv activation script exists
      tags: molecule-notest
      ansible.builtin.stat:
        path: "{{ venv_path }}/bin/activate"
      register: developer_venv

    - name: Verify | Assert Python virtualenv was created
      tags: molecule-notest
      ansible.builtin.assert:
        that:
          - developer_venv.stat.exists
        fail_msg: "Python venv not created"

    - name: Verify | Check linting tools installed in venv
      tags: molecule-notest
      ansible.builtin.command: "{{ venv_path }}/bin/pip show {{ item }}"
      register: developer_pip_pkg
      changed_when: false
      loop: "{{ linter_packages }}"

    - name: Verify | Check git global hooks configuration
      become: true
      become_user: "{{ developer_remote_user }}"
      ansible.builtin.command: git config --global core.hooksPath  # noqa: command-instead-of-module
      register: developer_git_hooks
      changed_when: false
      failed_when: developer_git_hooks.rc != 0

    - name: Verify | Assert git hooks path configured
      ansible.builtin.assert:
        that:
          - developer_git_hooks.stdout.strip() == "/home/{{ developer_remote_user }}/.git_hooks"
        fail_msg: "Expected git hooks path '/home/{{ developer_remote_user }}/.git_hooks', but got '{{ developer_git_hooks.stdout.strip() }}'"

    - name: Verify | Check global hooks delegate to the repo hook
      become: true
      become_user: "{{ developer_remote_user }}"
      # Los hooks del probe escriben a un archivo en vez de a stdout: git manda
      # la salida del de commit-msg a stderr. Sin `set -e` a propósito: si algo
      # no delega, queremos el diagnóstico completo en el assert, no un corte.
      ansible.builtin.shell: |
        set -uo pipefail
        hooks_dir="{{ developer_git_hooks.stdout.strip() }}"
        echo "git: $(git --version)"
        echo "hooksPath: $hooks_dir"
        ls -l "$hooks_dir"
        # El repo va en $HOME, no en /tmp: molecule monta /tmp como tmpfs y docker
        # le pone noexec, asi que ahi ningun hook del repo puede ejecutarse.
        repo=$(mktemp -d "$HOME/hook-probe.XXXXXX")
        cd "$repo" || echo "FALLO: cd al repo temporal"
        git init -q . || echo "FALLO: git init rc=$?"
        git config --show-origin --show-scope --get-all core.hooksPath || echo "(sin core.hooksPath)"
        git rev-parse --git-dir --git-common-dir
        echo "mensaje de prueba" > msg.txt
        cat > .git/hooks/commit-msg <<'HOOK'
        #!/bin/sh
        echo "commit-msg args=$#" >> delegation.log
        HOOK
        cat > .git/hooks/pre-push <<'HOOK'
        #!/bin/sh
        echo "pre-push args=$# refs=$(wc -l)" >> delegation.log
        HOOK
        chmod +x .git/hooks/commit-msg .git/hooks/pre-push
        test -x "$hooks_dir/commit-msg" && echo "global commit-msg: ejecutable" || echo "global commit-msg: NO ejecutable"
        test -x .git/hooks/commit-msg && echo "repo commit-msg: ejecutable" || echo "repo commit-msg: NO ejecutable"
        echo "--- dispatcher global invocado a mano, con traza ---"
        sh -x "$hooks_dir/commit-msg" msg.txt 2>&1 | tail -8
        echo "--- commit real ---"
        git -c user.name=molecule -c user.email=molecule@test commit -q --allow-empty -m probe 2>&1
        echo "--- pre-push directo ---"
        printf 'refs/heads/x 1111111 refs/heads/x 2222222\n' | "$hooks_dir/pre-push" origin url 2>&1
        echo "--- delegation.log ---"
        cat delegation.log 2>&1 || echo "(el hook del repo no escribio nada)"
      args:
        executable: /bin/bash
      register: developer_hook_delegation
      changed_when: false

    - name: Verify | Assert the repo hook keeps its arguments and refs
      ansible.builtin.assert:
        that:
          - "'commit-msg args=1' in developer_hook_delegation.stdout"
          - "'pre-push args=2 refs=1' in developer_hook_delegation.stdout"
        fail_msg: >-
          Los hooks globales tienen que delegar en el hook del repo con sus
          argumentos y sus refs. Sin los argumentos, pre-commit corta con
          "hook-impl for commit-msg expected 1 argument"; sin las refs, el
          pre-push del repo no chequea nada y sale 0.
          Salida: {{ developer_hook_delegation.stdout }}

    - name: Verify | Check dotfiles copied
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/home/{{ developer_remote_user }}/.bash_aliases"
        - "/home/{{ developer_remote_user }}/.adhoc_bash_ps.sh"
        - "/home/{{ developer_remote_user }}/.tmux"
        - "/home/{{ developer_remote_user }}/.prompt_git"
      register: developer_dotfiles

    - name: Verify | Assert dotfiles exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing configuration file {{ item.item }}"
      loop: "{{ developer_dotfiles.results }}"

    - name: Verify | Check devcli (r2) status
      ansible.builtin.command: dpkg-query -W -f=${db:Status-Status} devcli
      register: developer_devcli_status
      changed_when: false
      failed_when: false

    - name: Verify | Assert devcli IS installed on developer
      ansible.builtin.assert:
        that:
          - developer_devcli_status.stdout == 'installed'
        fail_msg: >-
          devcli (r2) debe estar instalado en el perfil developer: adhoccli lo
          declara en Suggests, asi que el rol lo instala explicito via
          tasks/devcli.yml. Estado encontrado: '{{ developer_devcli_status.stdout }}'

    - name: Verify | Check ssh configuration exists
      ansible.builtin.stat:
        path: "/home/{{ developer_remote_user }}/.ssh/config"
      register: developer_ssh_config

    - name: Verify | Assert ssh config created
      ansible.builtin.assert:
        that:
          - developer_ssh_config.stat.exists

    - name: Verify | Summarize developer toolchain versions
      ansible.builtin.debug:
        msg:
          - "Docker version: {{ developer_docker_version.stdout }}"
          - "VS Code version: {{ developer_code_version.stdout_lines | first }}"
          - "GitHub CLI version: {{ developer_gh_version.stdout_lines | first }}"
          - "Python venv path: {{ venv_path }}"
          - "Git hooks path: {{ git_hooks_path }}"
