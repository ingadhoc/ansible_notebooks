---
- name: Kubectl | Instalar y configurar kubectl desde el nuevo repositorio de pkgs.k8s.io
  tags: kubectl
  become: true
  block:
    - name: Kubectl | Instalar paquetes de prerrequisitos
      ansible.builtin.apt:
        name: "{{ funcional_kubectl_prerequisites }}"
        state: present

    - name: Kubectl | Eliminar el repositorio antiguo y obsoleto (apt.kubernetes.io)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent

    - name: Kubectl | Verificar si la clave GPG ya está instalada
      ansible.builtin.stat:
        path: "{{ funcional_external_repos.kubectl.keyring_path }}"
      register: funcional_kubectl_gpg_key

    - name: Kubectl | Añadir la nueva clave GPG de Kubernetes
      ansible.builtin.get_url:
        url: "{{ funcional_external_repos.kubectl.gpg_url }}"
        dest: /tmp/kubernetes-release.key
        mode: "0644"
      when: not funcional_kubectl_gpg_key.stat.exists

    - name: Kubectl | Convertir y guardar la clave GPG
      ansible.builtin.shell: >
        gpg --dearmor -o {{ funcional_external_repos.kubectl.keyring_path }} /tmp/kubernetes-release.key
      when: not funcional_kubectl_gpg_key.stat.exists
      changed_when: true

    - name: Kubectl | Remover archivo temporal de clave GPG
      ansible.builtin.file:
        path: /tmp/kubernetes-release.key
        state: absent
      when: not funcional_kubectl_gpg_key.stat.exists

    - name: Kubectl | Eliminar el repositorio legacy en formato .list (migración a deb822)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/kubernetes-pkgs.list
        state: absent

    - name: Kubectl | Añadir el nuevo repositorio de Kubernetes (formato deb822 .sources)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes-pkgs.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ funcional_external_repos.kubectl.repo_url }}
          Suites: /
          Signed-By: {{ funcional_external_repos.kubectl.keyring_path }}
      register: funcional_kubectl_repo

    # The gcloud repo also ships a kubectl (the slow dispatcher) whose epoch wins over pkgs.k8s.io.
    - name: Kubectl | Preferir el kubectl de pkgs.k8s.io sobre el del repo de gcloud
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/kubectl-pkgs-k8s
        owner: root
        group: root
        mode: "0644"
        content: |
          Package: kubectl
          Pin: origin pkgs.k8s.io
          Pin-Priority: 1001

    - name: Kubectl | Leer la versión de kubectl instalada
      ansible.builtin.command: dpkg-query -W -f=${Version} kubectl
      register: funcional_kubectl_installed
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Kubectl | Instalar kubectl
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ 0 if (funcional_kubectl_repo.changed | default(false)) else (funcional_apt_cache_valid_time | default(3600)) }}"
        name: kubectl
        # Replaces the gcloud dispatcher (version "1:NNN") on machines that already have it.
        state: "{{ 'latest' if funcional_kubectl_installed.stdout.startswith('1:') else 'present' }}"
        allow_downgrade: true

- name: Kubectl | Configurar autocompletado de bash para el usuario
  tags: kubectl
  become: true
  become_user: "{{ remote_regular_user }}"
  ansible.builtin.blockinfile:
    path: "/home/{{ remote_regular_user }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - kubectl completion"
    block: |
      if command -v kubectl >/dev/null 2>&1; then
          source <(kubectl completion bash)
          complete -o default -F __start_kubectl k
      fi
    create: false
