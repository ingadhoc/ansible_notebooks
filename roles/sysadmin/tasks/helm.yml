---
# https://helm.sh/docs/intro/install/#from-apt-debianubuntu
- name: SysAdmin - Install helm cli
  tags: helm_cli
  become: true
  block:
    - name: Helm | Verificar si la clave GPG ya está instalada
      ansible.builtin.stat:
        path: "{{ sysadmin_external_repos.helm.keyring_path }}"
      register: sysadmin_helm_gpg_key

    - name: Helm | Descargar la clave GPG de Helm
      ansible.builtin.get_url:
        url: "{{ sysadmin_external_repos.helm.gpg_url }}"
        dest: /tmp/helm-signing.asc
        mode: "0644"
      when: not sysadmin_helm_gpg_key.stat.exists

    - name: Helm | Convertir y guardar la clave GPG
      ansible.builtin.shell: >
        gpg --dearmor -o {{ sysadmin_external_repos.helm.keyring_path }} /tmp/helm-signing.asc
      when: not sysadmin_helm_gpg_key.stat.exists
      changed_when: true

    - name: Helm | Remover archivo temporal de clave GPG
      ansible.builtin.file:
        path: /tmp/helm-signing.asc
        state: absent
      when: not sysadmin_helm_gpg_key.stat.exists

    - name: Helm | Añadir el repositorio de Helm (formato deb822 .sources)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/helm-stable-debian.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ sysadmin_external_repos.helm.repo_url }}
          Suites: all
          Components: main
          Signed-By: {{ sysadmin_external_repos.helm.keyring_path }}
      register: sysadmin_helm_repo

    - name: Helm | Instalar helm
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ 0 if (sysadmin_helm_repo.changed | default(false)) else (funcional_apt_cache_valid_time | default(3600)) }}"
        name: helm
        state: present

    # Migración: el get_helm.sh de antes dejaba el binario en /usr/local/bin,
    # que pisa al de apt en el PATH y queda congelado en su versión de alta.
    - name: Helm | Eliminar el binario instalado por script (quedaba congelado)
      ansible.builtin.file:
        path: /usr/local/bin/helm
        state: absent

    - name: Helm | Configurar autocompletado de bash para el usuario
      become: false
      ansible.builtin.blockinfile:
        path: "/home/{{ remote_regular_user }}/.bashrc"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"
        mode: "0644"
        create: true
        block: |
          if command -v helm > /dev/null; then
            source <(helm completion bash)
          fi

    - name: Helm | Asegurar permisos correctos en .bashrc
      become: false
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.bashrc"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"
        mode: "0644"
