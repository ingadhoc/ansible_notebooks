---
# https://helm.sh/docs/intro/install/#from-the-binary-releases
- name: SysAdmin - Install helm cli
  tags: helm_cli
  block:
    - name: Helm | Detectar versión instalada
      ansible.builtin.command: /usr/local/bin/helm version --short
      check_mode: false
      register: sysadmin_helm_installed
      changed_when: false
      failed_when: false

    - name: Helm | Mapear arquitectura
      ansible.builtin.set_fact:
        sysadmin_helm_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: Helm | Instalar la release pinneada
      when: not (sysadmin_helm_installed.stdout | default('')).startswith('v' ~ sysadmin_helm_version ~ '+')
      become: true
      block:
        - name: Helm | Descargar tarball de la release
          ansible.builtin.get_url:
            url: "https://get.helm.sh/helm-v{{ sysadmin_helm_version }}-linux-{{ sysadmin_helm_arch }}.tar.gz"
            dest: "/tmp/helm-v{{ sysadmin_helm_version }}-linux-{{ sysadmin_helm_arch }}.tar.gz"
            checksum: "sha256:{{ sysadmin_helm_sha256[sysadmin_helm_arch] }}"
            mode: "0644"

        # In check mode the tarball is not downloaded: skip what needs it
        - name: Helm | Descomprimir tarball
          when: not ansible_check_mode
          ansible.builtin.unarchive:
            src: "/tmp/helm-v{{ sysadmin_helm_version }}-linux-{{ sysadmin_helm_arch }}.tar.gz"
            dest: /tmp
            remote_src: true

        - name: Helm | Instalar binario
          when: not ansible_check_mode
          ansible.builtin.copy:
            src: "/tmp/linux-{{ sysadmin_helm_arch }}/helm"
            dest: /usr/local/bin/helm
            remote_src: true
            owner: root
            group: root
            mode: "0755"

        - name: Helm | Limpiar archivos temporales
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/helm-v{{ sysadmin_helm_version }}-linux-{{ sysadmin_helm_arch }}.tar.gz"
            - "/tmp/linux-{{ sysadmin_helm_arch }}"

    - name: Helm | Configurar autocompletado de bash para el usuario
      ansible.builtin.blockinfile:
        path: "/home/{{ remote_regular_user }}/.bashrc"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"
        mode: "0644"
        create: true
        block: |
          if command -v helm > /dev/null; then
            source <(helm completion bash)
          fi

    - name: Helm | Asegurar permisos correctos en .bashrc
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.bashrc"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"
        mode: "0644"
