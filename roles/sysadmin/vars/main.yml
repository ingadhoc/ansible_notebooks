---
# Usuario genérico para ejecutar algunas tareas
remote_regular_user: "{{ ansible_facts['env'].SUDO_USER | default(ansible_user) }}"  # noqa: var-naming[no-role-prefix]
remote_regular_user_uid: "{{ ansible_facts['env'].SUDO_UID | default(ansible_facts['user_uid']) }}"  # noqa: var-naming[no-role-prefix]

# --- Configuración para Pulumi ---
# Pulumi se instala como binario en /usr/local/bin/pulumi.
# Por defecto instala la última release estable. Para pinnear:
# ansible-playbook local.yml -e "profile_override=sysadmin" -e "sysadmin_pulumi_version=3.x.y" -K
sysadmin_pulumi_version: "latest"
sysadmin_pulumi_install_root: "/opt/pulumi"

# Extensiones predefinidas para sysadmin
sysadmin_vscode_extension_list:
  # Container Tools
  - ms-azuretools.vscode-containers
  # Dev Containers
  - ms-vscode-remote.remote-containers
  # Docker
  - ms-azuretools.vscode-docker
  # Docker DX
  - docker.docker
  # GitHub Copilot
  - github.copilot
  # GitHub Copilot Chat
  - github.copilot-chat
  # GitLens
  - eamodio.gitlens
  # Kubernetes
  - ms-kubernetes-tools.vscode-kubernetes-tools
  # Pylance
  - ms-python.vscode-pylance
  # Python
  - ms-python.python
  # Python Debugger
  - ms-python.debugpy
  # Python Environments
  - ms-python.vscode-python-envs
  # YAML
  - redhat.vscode-yaml
  # knative
  - redhat.vscode-knative

# --- Configuración para KVM/QEMU ---
# Paquetes principales para KVM y herramientas de virtualización
sysadmin_kvm_packages:
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - bridge-utils
  - virt-manager
  - virtinst
  - virt-viewer

# Grupos a los que añadir el usuario para usar KVM
sysadmin_kvm_user_groups:
  - libvirt
  - kvm

# --- Configuración para NordVPN ---
sysadmin_nordvpn_gpg_path: "/usr/share/keyrings/nordvpn-archive-keyring.gpg"
sysadmin_nordvpn_package: "nordvpn"

# --- Configuración para sping ---
# Versión pinneada a propósito: al subirla, revisar el CHANGELOG upstream y
# copiar los hashes de los .deb del SHA256SUMS de la release.
sysadmin_sping_version: "1.5.5"
sysadmin_sping_sha256:
  amd64: d120fac9a2a271b40519af4571f7d2907d0478ffc32cef050b3520541d88be31  # pragma: allowlist secret
  arm64: 7d59bb321e87522735cbc7e248b548c78a53c10e8eaf533f581632af6ccebdbf  # pragma: allowlist secret

# --- Configuración para AWS CLI ---
# Directorio de instalación de los binarios de AWS CLI
sysadmin_awscli_install_dir: /usr/local/aws-cli
# Directorio donde se crean los symlinks (aws, aws_completer)
sysadmin_awscli_bin_dir: /usr/local/bin
# Forzar actualización aunque ya esté instalado:
#   ansible-playbook local.yml -e "profile_override=sysadmin" -e "sysadmin_awscli_force_update=true" -K
sysadmin_awscli_force_update: false

# --- Configuración del Tema de Iconos Numix ---
sysadmin_icon_packages:
  - numix-icon-theme-circle
  - gnome-tweaks

sysadmin_numix_icon_theme_name: "Numix-Circle"
