---
- name: Tareas previas al deploy de roles
  hosts: laptop
  become: true

  vars:
    target_profile: "{{ profile_override | default('funcional') }}"
    adhoc_battery_charge_start: 75
    adhoc_battery_charge_stop: 80
    adhoc_battery_health_warn: 80

  # --- TAREAS PREVIAS ---
  pre_tasks:
    - name: "Asegurar que /tmp tenga los permisos correctos (1777)"
      tags: always
      ansible.builtin.file:
        path: /tmp
        state: directory
        mode: "1777"

    # El apt de Debian 13 (verificador sqv) rechaza las firmas del repo de
    # Kubernetes anteriores a v1.32 ("Signature Packet v3 is not considered
    # secure since 2026-02-01"). Con una de esas configurada, `apt update`
    # entero da error y el play moría acá, ANTES de que kubectl.yml pudiera
    # reescribir el repo a la versión vigente. Se saca el repo viejo primero;
    # kubectl.yml escribe el bueno más adelante en la misma corrida.
    # Solo en Debian 13+: el rechazo es del verificador sqv (apt 3.x). En
    # Debian 12 / Ubuntu 22-24 ese repo viejo todavía funciona, y borrarlo en
    # una corrida parcial (--tags sin kubectl) lo dejaría sin reemplazo.
    - name: Apt | Detectar repos de Kubernetes con firma vieja (<= v1.31)
      tags: always
      when: >
        ansible_facts['distribution'] == 'Debian' and
        ansible_facts['distribution_version'] | int >= 13
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: "kubernetes*"
        # OJO: `contains` de find ancla al inicio de línea (re.match), por
        # eso el .* adelante — sin él no matchea nunca.
        contains: '.*stable:/v1\.(\d|[12]\d|3[01])/.*'
      register: apt_k8s_repos_viejos

    - name: Apt | Eliminar los repos de Kubernetes con firma vieja
      tags: always
      when: apt_k8s_repos_viejos is not skipped
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ apt_k8s_repos_viejos.files }}"
      loop_control:
        label: "{{ item.path }}"

    # Tolerante a propósito: un repo de terceros roto no debe voltear todo el
    # provisioning — cada task de instalación actualiza su propia caché.
    - name: Actualizar caché de paquetes
      tags: always
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      register: apt_cache_inicial
      failed_when: false

    - name: Apt | Avisar si la caché inicial no se pudo actualizar
      tags: always
      ansible.builtin.debug:
        msg: >-
          WARNING: el apt update inicial falló ({{ apt_cache_inicial.msg | default('sin detalle') }}).
          Se sigue igual; revisar los sources de terceros si algo no instala.
      when: "'Failed to update' in (apt_cache_inicial.msg | default(''))"

    - name: Timezone | Configurar zona horaria y sincronización NTP (Debian 13+)
      tags: timezone
      when: >
        ansible_facts['distribution'] == 'Debian' and
        ansible_facts['distribution_version'] | int >= 13
      block:
        - name: Timezone | Establecer zona horaria America/Argentina/Buenos_Aires
          community.general.timezone:
            name: America/Argentina/Buenos_Aires

        - name: Timezone | Instalar systemd-timesyncd
          ansible.builtin.apt:
            name: systemd-timesyncd
            state: present

        - name: Timezone | Asegurar que systemd-timesyncd esté habilitado y corriendo
          ansible.builtin.systemd:
            name: systemd-timesyncd.service
            enabled: true
            state: started

        # `set-ntp` habla con systemd-timedated, que cachea la lista de
        # unidades NTP: si timesyncd se instaló recién (task anterior), puede
        # responder "Failed to set ntp: NTP not supported". Se tolera el primer
        # intento, se refresca timedated y se reintenta; el reintento sí falla
        # de verdad si algo sigue mal. En containers (molecule) se saltea:
        # systemd-timesyncd trae ConditionVirtualization=!container.
        - name: Timezone | Asegurar que la sincronización NTP esté habilitada
          when: ansible_facts['virtualization_type'] | default('NA') not in ['docker', 'container', 'containerd', 'podman', 'lxc']
          block:
            - name: Timezone | Activar NTP (hora automática)
              ansible.builtin.command: timedatectl set-ntp true
              register: timezone_set_ntp
              changed_when: false
              failed_when: false

            - name: Timezone | Refrescar timedated y reintentar
              when: timezone_set_ntp.rc != 0
              block:
                - name: Timezone | Reiniciar systemd-timedated
                  ansible.builtin.systemd:
                    name: systemd-timedated.service
                    state: restarted

                - name: Timezone | Activar NTP (reintento)
                  ansible.builtin.command: timedatectl set-ntp true
                  changed_when: false

    - name: Power | Salud de batería y umbrales de carga
      tags: power
      block:
        - name: Power | Detectar si el equipo tiene batería
          ansible.builtin.stat:
            path: /sys/class/power_supply/BAT0
          register: adhoc_battery

        - name: Power | Configuración dependiente de batería
          when: adhoc_battery.stat.exists
          block:
            - name: Power | Crear directorio de facts locales
              ansible.builtin.file:
                path: /etc/ansible/facts.d
                state: directory
                owner: root
                group: root
                mode: "0755"

            - name: Power | Instalar fact de salud de batería
              ansible.builtin.copy:
                dest: /etc/ansible/facts.d/battery.fact
                owner: root
                group: root
                mode: "0755"
                content: |
                  #!/bin/sh
                  # Expone la salud de la batería como ansible_local.battery
                  B=/sys/class/power_supply/BAT0
                  [ -d "$B" ] || { echo '{}'; exit 0; }
                  # Normaliza a 0 lo vacío o no numérico: sysfs puede devolver un
                  # archivo vacío, y eso emitiría un JSON inválido
                  read_num() {
                    v=$(cat "$1" 2>/dev/null || cat "$2" 2>/dev/null)
                    case "$v" in
                      '' | *[!0-9]*) echo 0 ;;
                      *) echo "$v" ;;
                    esac
                  }
                  full=$(read_num "$B/energy_full" "$B/charge_full")
                  design=$(read_num "$B/energy_full_design" "$B/charge_full_design")
                  cycles=$(read_num "$B/cycle_count" /dev/null)
                  health=0
                  [ "$design" -gt 0 ] && health=$(awk "BEGIN{printf \"%.1f\", 100*$full/$design}")
                  printf '{"full": %s, "design": %s, "cycle_count": %s, "health_pct": %s}\n' \
                    "$full" "$design" "$cycles" "$health"

            - name: Power | Recolectar los facts locales recién instalados
              ansible.builtin.setup:
                filter: ansible_local

            - name: Power | Reportar salud de la batería
              ansible.builtin.debug:
                msg: >-
                  Batería al {{ adhoc_bat.health_pct | default('n/d') }}% de su capacidad de fábrica,
                  {{ adhoc_bat.cycle_count | default('n/d') }} ciclos.
              vars:
                adhoc_bat: "{{ ansible_local.battery | default({}) }}"

            - name: Power | Avisar si la batería está degradada
              ansible.builtin.debug:
                msg: >-
                  ATENCIÓN: batería al {{ ansible_local.battery.health_pct }}% con
                  {{ ansible_local.battery.cycle_count }} ciclos. Evaluar reemplazo.
              when:
                - ansible_local.battery.health_pct is defined
                - ansible_local.battery.health_pct | float < adhoc_battery_health_warn | float

            - name: Power | Detectar si el equipo expone umbrales de carga
              ansible.builtin.stat:
                path: /sys/class/power_supply/BAT0/charge_control_end_threshold
              register: adhoc_charge_threshold

            - name: Power | Umbrales de carga persistentes
              when: adhoc_charge_threshold.stat.exists
              block:
                - name: Power | Instalar el script de umbrales de carga
                  ansible.builtin.copy:
                    dest: /usr/local/bin/adhoc-battery-thresholds
                    owner: root
                    group: root
                    mode: "0755"
                    content: |
                      #!/bin/sh
                      # El start debe escribirse antes del stop: el EC valida start < stop
                      for b in /sys/class/power_supply/BAT*; do
                        [ -w "$b/charge_control_start_threshold" ] &&
                          echo {{ adhoc_battery_charge_start }} > "$b/charge_control_start_threshold"
                        [ -w "$b/charge_control_end_threshold" ] &&
                          echo {{ adhoc_battery_charge_stop }} > "$b/charge_control_end_threshold"
                      done
                      exit 0
                  register: adhoc_thresholds_script

                - name: Power | Instalar el servicio de umbrales de carga
                  ansible.builtin.copy:
                    dest: /etc/systemd/system/adhoc-battery-thresholds.service
                    owner: root
                    group: root
                    mode: "0644"
                    content: |
                      [Unit]
                      Description=Umbrales de carga de bateria (Adhoc)
                      After=multi-user.target

                      [Service]
                      Type=oneshot
                      RemainAfterExit=yes
                      ExecStart=/usr/local/bin/adhoc-battery-thresholds

                      [Install]
                      WantedBy=multi-user.target
                  register: adhoc_thresholds_unit

                - name: Power | Habilitar el servicio de umbrales de carga
                  ansible.builtin.systemd:
                    name: adhoc-battery-thresholds.service
                    daemon_reload: true
                    enabled: true
                    state: started

                - name: Power | Re-aplicar los umbrales si cambió la configuración
                  ansible.builtin.systemd:
                    name: adhoc-battery-thresholds.service
                    state: restarted
                  when: adhoc_thresholds_script is changed or adhoc_thresholds_unit is changed

            - name: Power | Detectar si TLP está instalado
              ansible.builtin.stat:
                path: /etc/tlp.conf
              register: adhoc_tlp_conf

            - name: Power | Ajustes para equipos con TLP
              when: adhoc_tlp_conf.stat.exists
              block:
                # Sin esto, un `tlp bat` deja el turbo apagado también en AC.
                - name: Power | Asegurar que TLP restaure el turbo boost en AC
                  ansible.builtin.lineinfile:
                    path: /etc/tlp.conf
                    regexp: '^#?\s*CPU_BOOST_ON_AC='
                    line: CPU_BOOST_ON_AC=1
                    state: present

                # grep sale 1 si ningún device es Mains (equipos que cargan por USB-C):
                # es el caso esperado y lo resuelve el `when` del bloque siguiente.
                - name: Power | Detectar si el equipo expone una fuente AC (tipo Mains)
                  ansible.builtin.shell: grep -lx Mains /sys/class/power_supply/*/type 2>/dev/null
                  register: adhoc_ac_device
                  changed_when: false
                  failed_when: false

                # Sin device Mains no hay uevents de power_supply: TLP nunca conmuta de perfil.
                - name: Power | Conmutación de perfil TLP por polling
                  when: adhoc_ac_device.stdout | trim == ''
                  block:
                    - name: Power | Instalar el chequeo de fuente de energía
                      ansible.builtin.copy:
                        dest: /usr/local/bin/tlp-powersource
                        owner: root
                        group: root
                        mode: "0755"
                        content: |
                          #!/bin/sh
                          S=/run/tlp-powersource.state
                          case "$(cat /sys/class/power_supply/BAT0/status)" in
                            Discharging) m=bat ;;
                            *)           m=ac  ;;
                          esac
                          [ -r "$S" ] && [ "$(cat "$S")" = "$m" ] && exit 0
                          printf '%s' "$m" > "$S"
                          /usr/sbin/tlp auto

                    - name: Power | Instalar unidades del chequeo de fuente
                      ansible.builtin.copy:
                        dest: "/etc/systemd/system/tlp-powersource.{{ item.ext }}"
                        owner: root
                        group: root
                        mode: "0644"
                        content: "{{ item.content }}"
                      loop:
                        - ext: service
                          content: |
                            [Unit]
                            Description=Aplicar perfil TLP segun la fuente de energia

                            [Service]
                            Type=oneshot
                            ExecStart=/usr/local/bin/tlp-powersource
                        - ext: timer
                          content: |
                            [Unit]
                            Description=Chequear la fuente de energia cada 30s

                            [Timer]
                            OnBootSec=30
                            OnUnitActiveSec=30
                            AccuracySec=5

                            [Install]
                            WantedBy=timers.target
                      loop_control:
                        label: "tlp-powersource.{{ item.ext }}"
                      notify: Power | Reiniciar el timer de fuente de energía

                    - name: Power | Habilitar el timer de fuente de energía
                      ansible.builtin.systemd:
                        name: tlp-powersource.timer
                        daemon_reload: true
                        enabled: true
                        state: started

                    - name: Power | Quitar la regla udev obsoleta
                      ansible.builtin.file:
                        path: /etc/udev/rules.d/86-tlp-bat0.rules
                        state: absent

  handlers:
    - name: Power | Reiniciar el timer de fuente de energía
      ansible.builtin.systemd:
        name: tlp-powersource.timer
        state: restarted

  # --- SECCIÓN DE ROLES ---
  roles:
    - role: "{{ target_profile }}"

    # Este rol SOLO se ejecuta si se pide explícitamente la etiqueta 'deploy'.
    - role: deploy
      tags:
        - deploy
        - never

  # --- TAREAS POSTERIORES ---
  post_tasks:
    - name: Limpiar paquetes huérfanos (con purge)
      tags: always
      ansible.builtin.apt:
        autoremove: true
        purge: true
      changed_when: false

    - name: Limpiar el caché de paquetes descargados
      tags: always
      ansible.builtin.apt:
        autoclean: true
      changed_when: false
